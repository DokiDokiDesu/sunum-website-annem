services:
  # Backend API Service
  - type: web
    name: sunum-website-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sunum-website-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: sunum-website-frontend
    env: static
    buildCommand: cd frontend && npm install && VITE_API_URL=https://sunum-website-backend.onrender.com npm run build
    staticPublishPath: ./frontend/dist

databases:
  - name: sunum-website-db
    databaseName: seminar_db
    user: seminar_user
    region: frankfurt
    plan: free
